<body>

<template id="tpl">
<div class="page {{ langClass }}" style="width: 100%; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #0C1821; color: #CCC9DC; font-family: 'Space Grotesk', Helvetica, Arial, sans-serif; line-height: 1.5; position: relative; {{ rootLook }}">

<header class="hdr" style="flex: none; display: flex; justify-content: flex-end; align-items: center; height: 44px">

<sc-if value="{{ isOpen }}" hint-placeholder-val="{{ false }}"><button type="button" class="hdr-back" onclick="{{ back }}" style="margin-right: auto; min-height: 44px; padding: 0 20px; cursor: pointer; background: none; border: 1px solid #CCC9DC; font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #CCC9DC; width: 152px; height: 52px; white-space: nowrap"><span class="t-es">← Regresar</span><span class="t-en">← Back</span></button></sc-if>
<nav class="hdr-nav" style="display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 8px">
<button type="button" class="nav-btn" onclick="{{ goBio }}" style="min-height: 44px; padding: 0 20px; cursor: pointer; background: none; font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #CCC9DC; width: 152px; height: 52px; white-space: nowrap; {{ navBio }}"><span class="t-es">Acerca de mí</span><span class="t-en">About me</span></button><button type="button" class="nav-btn" onclick="{{ goContents }}" style="min-height: 44px; padding: 0 20px; cursor: pointer; background: none; font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #CCC9DC; width: 152px; height: 52px; white-space: nowrap; {{ navContents }}"><span class="t-es">Proyectos</span><span class="t-en">Projects</span></button>
<button type="button" class="nav-btn" onclick="{{ openContact }}" aria-haspopup="dialog" style="min-height: 44px; padding: 0 20px; cursor: pointer; background: none; font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #CCC9DC; width: 152px; height: 52px; white-space: nowrap; {{ navContact }}"><span class="t-es">Contacto</span><span class="t-en">Contact</span></button>
<div role="group" aria-label="Idioma / Language" style="display: flex; align-items: center; margin-left: 4px">
<button type="button" class="lang-btn" lang="es" onclick="{{ setEs }}" aria-pressed="{{ isEs }}" style="min-height: 44px; min-width: 44px; padding: 0 10px; cursor: pointer; background: none; border: 0; font-family: 'IBM Plex Mono', monospace; font-size: 14px; {{ esLook }}">ES</button>
<span aria-hidden="true" style="color: #324A5F; font-family: 'IBM Plex Mono', monospace">|</span>
<button type="button" class="lang-btn" lang="en" onclick="{{ setEn }}" aria-pressed="{{ isEn }}" style="min-height: 44px; min-width: 44px; padding: 0 10px; cursor: pointer; background: none; border: 0; font-family: 'IBM Plex Mono', monospace; font-size: 14px; {{ enLook }}">EN</button>

</header>

<nav class="m-nav">
<button type="button" class="m-link" onclick="{{ mGoBio }}" aria-current="{{ curBio }}"><span class="t-es">Acerca de mí</span><span class="t-en">About me</span></button>
<button type="button" class="m-link" onclick="{{ mGoContents }}" aria-current="{{ curContents }}"><span class="t-es">Proyectos</span><span class="t-en">Projects</span></button>
<button type="button" class="m-link" onclick="{{ mContact }}"><span class="t-es">Contacto</span><span class="t-en">Contact</span></button>
</nav>

<button type="button" class="lang-btn" lang="es" onclick="{{ setEs }}" aria-pressed="{{ isEs }}" style="min-height: 44px; min-width: 44px; padding: 0 10px; cursor: pointer; background: none; border: 0; font-family: 'IBM Plex Mono', monospace; font-size: 14px; {{ esLook }}">ES</button>
<span aria-hidden="true" style="color: #324A5F; font-size: 18px">|</span>
<button type="button" class="lang-btn" lang="en" onclick="{{ setEn }}" aria-pressed="{{ isEn }}" style="min-height: 44px; min-width: 44px; padding: 0 10px; cursor: pointer; background: none; border: 0; font-family: 'IBM Plex Mono', monospace; font-size: 14px; {{ enLook }}">EN</button>
</div>
</div>

<sc-if value="{{ isBio }}" hint-placeholder-val="{{ true }}">
<section class="bio-section" style="flex: 1 1 0; min-height: 0; margin-top: clamp(12px, 3vh, 40px); display: grid; grid-template-columns: 0.8fr 1.2fr; gap: clamp(24px, 5vw, 72px); animation: fadeIn 0.6s ease both">
<div class="bio-photo-wrap" style="display: flex; flex-direction: column; gap: 10px; min-height: 0; min-width: 0; max-width: 560px">
<div class="bio-photo" style="position: relative; flex: 1 1 0; min-height: 0">
<img src="img/portada/casa-san-diego.webp" srcset="img/portada/casa-san-diego.webp 950w" sizes="(max-width: 820px) 100vw, 40vw" alt="{{ photoAlt }}" fetchpriority="high" style="position: absolute; inset: 0; display: block; width: 100%; height: 100%; object-fit: cover">
</div>
<div style="flex: none; font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.04em; color: #9AA3B5"><span class="t-es">Casa San Diego · Render</span><span class="t-en">Casa San Diego · Render</span></div>
</div>
<div class="bio-text" style="display: flex; flex-direction: column; justify-content: center; min-width: 0; min-height: 0">

<h1 class="bio-name" style="margin: clamp(6px, 1.4vh, 16px) 0 0; font-size: clamp(36px, min(9.5vh, 5.2vw), 84px); line-height: 1; font-weight: 700; letter-spacing: -0.04em; white-space: nowrap">Christian Valle</h1>
<div style="margin-top: clamp(6px, 1.2vh, 14px); font-size: clamp(14px, 2.4vh, 22px); color: #9AA3B5"><span class="t-es">Arquitecto · Modelador BIM</span><span class="t-en">Architect · BIM Modeller</span></div>
<p style="margin: clamp(10px, 2vh, 24px) 0 0; font-size: clamp(13px, 2.1vh, 20px); line-height: 1.45; max-width: 680px"><span class="t-es">Soy Christian Valle, arquitecto y modelador BIM. Creo que cada proyecto empieza con una pregunta sencilla —¿cómo se va a vivir este espacio?— y que el buen diseño consiste en responderla con cuidado, desde el primer boceto hasta el último detalle. Me formé en la Universidad de El Salvador y he trabajado en viviendas de 400 a más de 1,000 m² con ArchitectoSV, donde descubrí cuánto disfruto del modelado BIM.</span><span class="t-en">I'm Christian Valle, an architect and BIM modeller. I believe every project starts with a simple question — how will this space be lived in? — and that good design means answering it with care, from the first sketch to the last detail. I trained at the Universidad de El Salvador and have worked on homes from 400 to over 1,000 m² with ArchitectoSV, where I discovered how much I enjoy BIM modelling.</span></p>
<p style="margin: clamp(6px, 1.2vh, 12px) 0 0; font-size: clamp(12.5px, 1.8vh, 16px); line-height: 1.45; font-style: italic; max-width: 680px"><span class="t-es">Para mí, la arquitectura está en el equilibrio entre la idea que emociona y la técnica que la hace posible. Este portafolio reúne algunos de los proyectos que me han formado.</span><span class="t-en">To me, architecture lives in the balance between the idea that inspires and the technique that makes it possible. This portfolio brings together some of the projects that have shaped me.</span></p>
<dl class="bio-dl" style="margin: clamp(10px, 2vh, 24px) 0 0; display: grid; grid-template-columns: max-content 1fr; align-items: baseline; gap: clamp(2px, 0.7vh, 6px) clamp(14px, 2vw, 28px); font-size: clamp(12.5px, 1.9vh, 16px); line-height: 1.35">
<dt style="font-family: 'IBM Plex Mono', monospace; font-size: clamp(12px, 1.8vh, 15px); color: #B4BDD0"><span class="t-es">Software</span><span class="t-en">Software</span></dt>
<dd style="margin: 0"><span class="t-es">Revit · AutoCAD · D5 Render · Lumion · Photoshop · Illustrator · Dynamo</span><span class="t-en">Revit · AutoCAD · D5 Render · Lumion · Photoshop&nbsp;</span></dd>
<dt style="font-family: 'IBM Plex Mono', monospace; font-size: clamp(12px, 1.8vh, 15px); color: #B4BDD0"><span class="t-es">Idiomas</span><span class="t-en">Languages</span></dt>
<dd style="margin: 0"><span class="t-es">Español (nativo) · Inglés (C1)</span><span class="t-en">Spanish (native) · English (C1)</span></dd>
<dt style="font-family: 'IBM Plex Mono', monospace; font-size: clamp(12px, 1.8vh, 15px); color: #B4BDD0"><span class="t-es">Reconocimiento</span><span class="t-en">Recognition</span></dt>
<dd style="margin: 0"><span class="t-es">Mención especial, Bienal de Arquitectura 2024</span><span class="t-en">Special mention, Bienal de Arquitectura 2024</span></dd>
<dt style="font-family: 'IBM Plex Mono', monospace; font-size: clamp(12px, 1.8vh, 15px); color: #B4BDD0"><span class="t-es">Ubicación</span><span class="t-en">Location</span></dt>
<dd style="margin: 0"><span class="t-es">Dublín, Irlanda · Abierto a proyectos en cualquier país</span><span class="t-en">Dublin, Ireland · Open to projects in any country</span></dd>
<dt style="font-family: 'IBM Plex Mono', monospace; font-size: clamp(12px, 1.8vh, 15px); color: #B4BDD0"><span class="t-es">Contacto</span><span class="t-en">Contact</span></dt>
<dd style="margin: 0">chrisvl23@icloud.com</dd>
</dl>
<div class="bio-cta" style="margin-top: clamp(12px, 2.6vh, 28px); display: flex; flex-wrap: wrap; align-items: center; gap: 8px 28px">
<button type="button" class="btn-primary" onclick="{{ goContents }}" style="min-height: clamp(40px, 5.4vh, 48px); padding: 0 32px; cursor: pointer; background: none; color: #CCC9DC; font-family: 'IBM Plex Mono', monospace; font-size: clamp(13px, 1.9vh, 16px); border: 1px solid #CCC9DC; white-space: nowrap"><span class="t-es">Ver proyectos →</span><span class="t-en">View projects →</span></button>
<a href="{{ cvHref }}" download="{{ cvName }}" class="link-cv" style="display: inline-flex; align-items: center; min-height: 40px; font-family: 'IBM Plex Mono', monospace; font-size: clamp(12.5px, 1.8vh, 14px); color: #9AA3B5; text-decoration: underline; text-underline-offset: 4px"><span class="t-es">Descargar CV</span><span class="t-en">Download CV</span></a>
</div>
</div>
</section>
</sc-if>

<sc-if value="{{ isContents }}" hint-placeholder-val="{{ false }}">
<section style="animation: fadeIn 0.6s ease both">
<div class="title-wrap" style="overflow: hidden; transition: height 0.7s ease, opacity 0.5s ease; {{ titleLook }}">
<h2 class="proj-title" style="margin: 36px 0 0; display: block; width: fit-content; font-size: 52px; line-height: 1.2; font-weight: 300; letter-spacing: 0.4em; background: linear-gradient(transparent calc(100% - 3px), {{accent}} calc(100% - 3px))"><span class="t-es">PROYECTOS</span><span class="t-en">PROJECTS</span></h2>
</div>

<div class="strips-box" style="position: relative; transition: height 0.7s ease, margin-top 0.7s ease; {{ boxLook }}">
<div class="strips-row" style="display: flex; height: 100%; {{ stripsLook }}">
<sc-for list="{{ items }}" as="p" hint-placeholder-count="4">
<button type="button" class="strip" onclick="{{ p.open }}" aria-label="{{ p.aria }}" style="display: flex; flex-direction: column; min-width: 0; padding: 0; border: 0; background: none; cursor: pointer; overflow: hidden; font-family: inherit; color: inherit; text-align: center; transition: flex-grow 0.7s ease, margin-left 0.7s ease, opacity 0.5s ease; {{ p.look }}">
<span class="strip-img" style="display: block; position: relative; flex: 1; min-height: 0; overflow: hidden; {{ p.img }}">
<span style="position: absolute; top: 24px; left: 0; right: 0; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #9AA3B5">{{ p.imgLabel }}</span>
<sc-if value="{{ p.is3 }}"><picture><source media="(max-width:820px),(max-height:520px),(max-width:1100px) and (orientation:portrait)" srcset="img/casa-guayabo/render-1-1200.webp 1200w, img/casa-guayabo/render-1.webp 1800w" sizes="(min-width: 600px) 50vw, 100vw"><img src="img/casa-guayabo/tira.webp" alt="{{ p.imgAlt }}" loading="lazy" decoding="async" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%"></picture><img class="strip-photo" src="img/casa-guayabo/tira-duotono.webp" alt="{{ p.imgAlt }}" loading="lazy" decoding="async" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%; opacity: 1"></sc-if>
<sc-if value="{{ p.is2 }}"><picture><source media="(max-width:820px),(max-height:520px),(max-width:1100px) and (orientation:portrait)" srcset="img/casa-arroyo/render-1-1200.webp 1200w, img/casa-arroyo/render-1.webp 1440w" sizes="(min-width: 600px) 50vw, 100vw"><img src="img/casa-arroyo/tira.webp" alt="{{ p.imgAlt }}" loading="lazy" decoding="async" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%"></picture><img class="strip-photo" src="img/casa-arroyo/tira-duotono.webp" alt="{{ p.imgAlt }}" loading="lazy" decoding="async" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%; opacity: 1"></sc-if>
<sc-if value="{{ p.is1 }}"><picture><source media="(max-width:820px),(max-height:520px),(max-width:1100px) and (orientation:portrait)" srcset="img/casa-mabel/render-1-1200.webp 1200w, img/casa-mabel/render-1.webp 1800w" sizes="(min-width: 600px) 50vw, 100vw"><img src="img/casa-mabel/tira.webp" alt="{{ p.imgAlt }}" loading="lazy" decoding="async" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 30% 50%"></picture><img class="strip-photo" src="img/casa-mabel/tira-duotono.webp" alt="{{ p.imgAlt }}" loading="lazy" decoding="async" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 30% 50%; opacity: 1"></sc-if>
<sc-if value="{{ p.is0 }}"><picture><source media="(max-width:820px),(max-height:520px),(max-width:1100px) and (orientation:portrait)" srcset="img/teatro-san-miguel/render-1-1200.webp 1200w, img/teatro-san-miguel/render-1.webp 1599w" sizes="(min-width: 600px) 50vw, 100vw"><img src="img/teatro-san-miguel/tira.webp" alt="{{ p.imgAlt }}" loading="lazy" decoding="async" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 30% 50%"></picture><img class="strip-photo" src="img/teatro-san-miguel/tira-duotono.webp" alt="{{ p.imgAlt }}" loading="lazy" decoding="async" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 30% 50%; opacity: 1"></sc-if>
<sc-if value="{{ p.hasQuote }}"><span class="strip-quote" style="position: absolute; left: 0; right: 0; bottom: 0; padding: 48px 20px 20px; white-space: normal; font-size: 15px; line-height: 1.4; color: #CCC9DC; background: linear-gradient(transparent, rgba(12,24,33,0.9))">{{ p.quote }}</span></sc-if>
<span class="strip-num" style="position: absolute; right: 4px; bottom: -52px; font-size: 260px; line-height: 1; font-weight: 700; letter-spacing: -0.06em; color: #0C1821">{{ p.n }}</span>
</span>
<span class="strip-txt" style="display: block; flex: none; height: 150px; padding-top: 18px; white-space: nowrap">
<span class="pict" style="display: flex; align-items: center; justify-content: center; height: 30px; margin-bottom: 10px; color: {{ p.accent }}"><sc-if value="{{ p.is0 }}"><svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="5" width="28" height="7" fill="#C2665F"></rect><polygon points="5,11 9,11 27,29 23,29" fill="#C2665F"></polygon><polygon points="23,11 27,11 9,29 5,29" fill="#C2665F"></polygon></svg></sc-if><sc-if value="{{ p.is1 }}"><svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><defs><mask id="casa-mabel-roof"><rect width="32" height="32" fill="#fff"></rect><path d="M2 7 L11 16 L21 16 L30 7 M2 25 L11 16 M21 16 L30 25" stroke="#000" stroke-width="1.8" fill="none"></path></mask></defs><rect x="2" y="7" width="28" height="18" fill="#C9A57B" mask="url(#casa-mabel-roof)"></rect></svg></sc-if><sc-if value="{{ p.is2 }}"><svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><defs><mask id="casa-arroyo-tower"><rect width="32" height="32" fill="#fff"></rect><path d="M0 14 H32 M0 19.5 H32 M0 25 H32" stroke="#000" stroke-width="1.2"></path></mask></defs><g fill="#9AAFC4"><polygon points="4,4 28,4 24,8.5 8,8.5"></polygon><g mask="url(#casa-arroyo-tower)"><rect x="8" y="8.5" width="5" height="20.5"></rect><rect x="19" y="8.5" width="5" height="20.5"></rect></g></g></svg></sc-if><sc-if value="{{ p.is3 }}"><svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><g fill="#9DB89A"><rect x="2" y="6" width="17" height="5"></rect><rect x="8" y="13.5" width="17" height="5"></rect><rect x="14" y="21" width="16" height="5"></rect></g></svg></sc-if></span>
<span class="strip-title" style="display: block; font-size: 20px; font-weight: 500">{{ p.title }}</span>
<span style="display: block; font-size: 14px; color: #9AA3B5">{{ p.sub1 }}</span>
<span style="display: block; font-size: 14px; color: #9AA3B5">{{ p.sub2 }}</span>
<span class="strip-quote-m">{{ p.quote }}</span>
</span>
</button>
</sc-for>
</div>

<div class="proj-overlay" style="position: absolute; inset: -2px; background: #0C1821; outline: 0; border: 0; box-shadow: none; display: flex; flex-direction: column; transition: opacity 0.6s ease; {{ detailLook }}">
<div style="position: absolute; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center; background: #0C1821; pointer-events: none; {{ splashLook }}"><img data-bind-src="{{ splashPic }}" data-sizes="100vw" alt="{{ splashAlt }}" style="display: block; width: 100%; max-height: 100%; aspect-ratio: 2.39 / 1; object-fit: cover; object-position: 50% 50%; {{ splashScale }}"></div>
<div class="proj-content" style="flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out; {{ contentLook }}">
<div class="proj-grid" style="flex: 1 1 0; min-height: 0; display: grid; grid-template-columns: 1.15fr 1fr; gap: 56px">
<div class="proj-left" style="display: flex; flex-direction: column; gap: 12px; min-height: 0">
<sc-if value="{{ isPlanView }}" hint-placeholder-val="{{ false }}"><div class="tap-hint" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"><path d="M10 2h4v4M14 2L9.5 6.5M6 14H2v-4M2 14l4.5-4.5"></path></svg><span class="t-es">Toca para ampliar</span><span class="t-en">Tap to enlarge</span></div></sc-if>
<div class="viewer-wrap" style="flex: 1; min-height: 0; container-type: size; display: flex; align-items: center; justify-content: center">
<div class="viewer {{ viewerCls }}" style="position: relative; flex: none; width: min(100cqw, 150cqh); aspect-ratio: 3 / 2; overflow: hidden; background: #0C1821">
<sc-if value="{{ noImg }}" hint-placeholder-val="{{ true }}">
<div style="position: absolute; inset: 0; background: repeating-linear-gradient(45deg, #1B2A41, #1B2A41 10px, #142234 10px, #142234 20px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; padding: 16px">
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 14px">[{{ view.label }}]</div>
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #9AA3B5">{{ view.hint }}</div>
